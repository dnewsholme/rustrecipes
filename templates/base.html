<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Recipe Manager{% endblock %} - Rust Recipes</title>
    <base href="{{ base_url }}/">
    <link rel="stylesheet" href="static/styles.css">
    <link rel="icon" type="image/svg+xml" href="static/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            document.documentElement.setAttribute('data-theme', savedTheme);
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>
    {% block head %}{% endblock %}
</head>
<body>
    <header>
        <div class="container header-content">
            <a href="./" class="logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <ellipse cx="12" cy="12" rx="8" ry="10" />
                  <line x1="4" y1="12" x2="20" y2="12" />
                  <path d="M8 20.5l-2 2.5" />
                  <path d="M16 20.5l2 2.5" />
                  <line x1="6" y1="20" x2="18" y2="20" />
                  <path d="M10 6h4v2h-4z" fill="currentColor" />
                  <circle cx="12" cy="8" r="1.5" />
                </svg>
                RustRecipes
            </a>
            <nav style="display: flex; gap: 1rem; align-items: center;">
                <button id="theme-toggle" class="btn btn-secondary" style="padding: 0.5rem; border-radius: 50%;" aria-label="Toggle Dark Mode">
                    <svg id="theme-icon-dark" style="display: none;" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                    <svg id="theme-icon-light" style="display: none;" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                </button>
                {% block header_actions %}{% endblock %}
                <a href="new" class="btn btn-primary">+ New Recipe</a>
            </nav>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer>
        <div class="container" style="text-align: center; padding: 2rem 0; color: var(--text-secondary); font-size: 0.9rem; border-top: 1px solid var(--border-color); margin-top: 3rem;">
            <p>&copy; 2026 Rust Recipe Manager • v{{ app_version }}</p>
        </div>
    </footer>

    {% block scripts %}{% endblock %}
    <script>
        const themeToggle = document.getElementById('theme-toggle');
        const iconDark = document.getElementById('theme-icon-dark');
        const iconLight = document.getElementById('theme-icon-light');
        
        function updateThemeIcons() {
            if (document.documentElement.getAttribute('data-theme') === 'dark') {
                iconDark.style.display = 'none';
                iconLight.style.display = 'block';
            } else {
                iconDark.style.display = 'block';
                iconLight.style.display = 'none';
            }
        }
        
        updateThemeIcons();
        
        themeToggle.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcons();
        });
    </script>
</body>
</html>
