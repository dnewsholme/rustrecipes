[package]
name = "recipemanager"
version = "0.1.1"
edition = "2024"

[dependencies]
askama = "0.16.0"
axum = { version = "0.8.9", features = ["multipart", "macros"] }
base64 = "0.22.1"
flate2 = "1.1.9"
gray_matter = "0.3.2"
html-escape = "0.2.13"
html2text = "0.14.0"
pulldown-cmark = "0.13.3"
regex = "1.12.3"
reqwest = { version = "0.13.3", features = ["json", "cookies"] }
scraper = "0.26.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
slug = "0.1.6"
tokio = { version = "1.52.1", features = ["full"] }
tower-http = { version = "0.6.8", features = ["fs", "trace", "set-header"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.23"
uuid = { version = "1.23.1", features = ["v4"] }
zip = "8.6.0"
yt-transcript-rs = "0.1.0"
axum-extra = { version = "0.12.6", features = ["cookie", "cookie-private"] }
bcrypt = "0.19.0"
image = { version = "0.25.10", features = ["webp"] }
thiserror = "2.0.18"
lazy_static = "1.5.0"
tower = "0.5.3"

[dev-dependencies]
http-body-util = "0.1.2"
