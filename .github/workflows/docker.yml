name: Publish Docker Image

on:
  push:
    branches:
      - main
  # Allow manual triggering of the workflow
  workflow_dispatch:
  
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build frontend SPA
        run: |
          cd frontend
          npm ci
          npm run build
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cargo test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history required for GitVersion SemVer calculation

      - name: Calculate SemVer with GitVersion
        id: gitversion
        run: |
          GV_JSON=$(docker run --rm -v "${{ github.workspace }}:/repo" gittools/gitversion:latest /repo)
          echo "$GV_JSON"
          SEMVER=$(echo "$GV_JSON" | grep -o '"SemVer": *"[^"]*"' | head -n1 | cut -d'"' -f4)
          if [ -z "$SEMVER" ]; then
            echo "Failed to parse SemVer from GitVersion output"
            exit 1
          fi
          DOCKER_SEMVER=$(echo "${SEMVER}" | tr '+' '-')
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-8)
          echo "semver=${SEMVER}" >> "$GITHUB_OUTPUT"
          echo "docker_semver=${DOCKER_SEMVER}" >> "$GITHUB_OUTPUT"
          echo "sha_short=${SHA_SHORT}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ steps.gitversion.outputs.semver }}
          tags: |
            dnewsholme/rustrecipes:latest
            dnewsholme/rustrecipes:${{ steps.gitversion.outputs.docker_semver }}
            dnewsholme/rustrecipes:${{ steps.gitversion.outputs.sha_short }}
          cache-from: type=registry,ref=dnewsholme/rustrecipes:buildcache
          cache-to: type=registry,ref=dnewsholme/rustrecipes:buildcache,mode=max
